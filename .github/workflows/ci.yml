name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install native dev headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libavformat-dev libavcodec-dev libavutil-dev libswresample-dev
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install native dev headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libavformat-dev libavcodec-dev libavutil-dev libswresample-dev
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
